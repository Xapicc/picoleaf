name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: raspberrypi/pico-sdk
          ref: "2.3.1"
          path: pico-sdk
          submodules: true
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib ninja-build
      # Built before the tests: pico/test/test_pio.py reads the generated pico/build/bus.pio.h
      - run: cmake -S pico -B pico/build -G Ninja && cmake --build pico/build
      - run: uv sync --frozen
      - run: uv run --frozen ruff check tools pico/test
      - run: uv run --frozen ruff format --check tools pico/test
      - run: uv run --frozen pytest
      - uses: actions/upload-artifact@v4
        with:
          name: canvas_probe
          path: |
            pico/build/canvas_probe.uf2
            pico/build/canvas_probe.elf
